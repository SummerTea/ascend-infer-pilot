# 模板：复杂双标杆（api_type + aclnn_api_type + golden）
api: pytorch
api_type: {{REGISTER_CPU}}
aclnn_api_type: {{REGISTER_NPU}}
version: v2.1
name: {{ACLNN_NAME}}
aclnn_name: {{OP_NAME}}
generate: {{GENERATE}}
dtype_numbers: 6
extra_numbers: 0
standard:
  acc:
    cv_fused_double_benchmark:
      max_re_ratio: 5
      avg_re_ratio: 1.5
      root_mean_squared_ratio: 1.5
  perf: [0.95, 0.95]
inputs:
  # TODO: 顺序与 def.cpp 一致
  - name: input0
    type: tensor
    required: true
    dtypes:
      values: [bf16]
    ranges:
      valid:
        values: [[-10, 10]]
      invalid:
        values: []
    shapes:
      dim_numbers:
        values: [2]
      dim_values:
        values: [[1, 1024]]
