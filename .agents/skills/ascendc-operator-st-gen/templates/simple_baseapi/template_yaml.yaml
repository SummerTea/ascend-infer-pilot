# 模板：简单双标杆（单 api_type + BaseApi）
# 替换 {{*}} 后: atk case -f aclnn_{{OP_SNAKE}}.yaml -p . -s 1234
api: pytorch
api_type: {{REGISTER_SIMPLE}}
version: v2.1
name: {{ACLNN_NAME}}
aclnn_name: {{OP_NAME}}
generate: {{GENERATE}}
dtype_numbers: 6
extra_numbers: 0
standard:
  acc:
    cv_fused_double_benchmark:
      max_re_ratio: 5
      avg_re_ratio: 1.5
      root_mean_squared_ratio: 1.5
  perf: [0.95, 0.95]
inputs:
  # TODO: 按 op_host/*_def.cpp 顺序补齐 tensor / attr / attrs
  - name: input0
    type: tensor
    required: true
    dtypes:
      values: [fp16, bf16]
    ranges:
      valid:
        values: [[-5, 5]]
      invalid:
        values: []
    shapes:
      dim_numbers:
        values: [2]
      dim_values:
        values: [[1, 1024]]
